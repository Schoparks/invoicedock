<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244d41">
  <meta name="color-scheme" content="light">
  <title>票栈 · 个人发票管理</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="sidebar">
    <a class="brand" href="#invoices" aria-label="票栈首页"><span class="brand-symbol" aria-hidden="true">票</span><span>票栈<small>个人与团队发票管理</small></span></a>
    <label class="space-switch"><span>当前空间</span><select id="space-select" aria-label="切换个人或群组空间"><option value="">个人空间</option></select></label><div class="nav-label">发票与报销</div>
    <nav aria-label="主要导航">
      <a href="#invoices" data-page="invoices"><span class="nav-icon" aria-hidden="true">▤</span><span id="invoice-nav-label">我的票库</span><span id="invoice-count" class="nav-count">0</span></a>
      <a href="#match" data-page="match"><span class="nav-icon" aria-hidden="true">⌘</span>智能匹配</a>
      <a href="#batches" data-page="batches"><span class="nav-icon" aria-hidden="true">☷</span>报销单</a>
      <div class="nav-divider"></div>
      <a href="#settings" data-page="settings"><span class="nav-icon" aria-hidden="true">⊞</span>项目与额度</a>
      <a href="#groups" data-page="groups"><span class="nav-icon" aria-hidden="true">♧</span>群组管理</a>
      <a href="#mailboxes" data-page="mailboxes"><span class="nav-icon" aria-hidden="true">✉</span>邮箱收票</a>
      <a href="#data" data-page="data"><span class="nav-icon" aria-hidden="true">⇩</span>数据管理</a>
      <a href="#account" data-page="account"><span class="nav-icon" aria-hidden="true">⚙</span>账号设置</a>
    </nav>
    <div class="account-note"><div class="account-avatar" id="account-avatar">票</div><div class="account-info"><strong id="account-name"></strong><small id="account-email"></small></div><button class="icon-btn" data-action="logout" aria-label="退出登录" title="退出登录">↪</button></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span><span id="workspace-name">个人空间</span> <span class="breadcrumb">/ <span id="breadcrumb">我的票库</span></span></span><span class="topbar-right"><span id="today" class="today"></span><button class="mobile-logout link-button" data-action="logout">退出登录</button></span></header>
    <main id="main" tabindex="-1"><div class="loading-state"><span class="spinner"></span><p>正在打开你的票栈…</p></div></main>
    <footer class="app-footer"><span>票栈 · 个人与团队</span><span>每一张发票，都有去处。</span></footer>
  </div>
  <input id="file-input" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.xml,.ofd,.zip" hidden>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
